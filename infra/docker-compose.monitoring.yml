version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pp_prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '9090:9090'
    restart: unless-stopped
    networks:
      - placementpro

  grafana:
    image: grafana/grafana:latest
    container_name: pp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - placementpro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pp_pg_exporter
    environment:
      DATA_SOURCE_NAME: 'postgresql://postgres:${DB_PASSWORD:-postgres_password_change_me}@postgres:5432/placementpro?sslmode=disable'
    ports:
      - '9187:9187'
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - placementpro

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pp_redis_exporter
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    ports:
      - '9121:9121'
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - placementpro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pp_node_exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - '9100:9100'
    restart: unless-stopped
    networks:
      - placementpro

volumes:
  prometheus_data:
  grafana_data:

networks:
  placementpro:
    external: true
