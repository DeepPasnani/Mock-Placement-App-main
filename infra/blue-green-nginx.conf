# Blue-Green Deployment Nginx Configuration
#
# This config routes traffic to either the "blue" or "green" backend
# environment based on the __ACTIVE_ENV__ placeholder, which is replaced
# by the deploy-blue-green.sh script during deployment.

upstream placementpro_backend {
    # Active environment — replaced by deploy script
    server backend-__ACTIVE_ENV__:5000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream placementpro_backend_ws {
    ip_hash;
    server backend-__ACTIVE_ENV__:5000;
}

# Both environments run simultaneously on different ports for health checks
# Blue:   backend-blue:5000
# Green:  backend-green:5001

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API — routed to active environment
    location /api/ {
        proxy_pass http://placementpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # WebSocket
    location /ws {
        proxy_pass http://placementpro_backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Health check (accessible for monitoring)
    location /health {
        proxy_pass http://placementpro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
