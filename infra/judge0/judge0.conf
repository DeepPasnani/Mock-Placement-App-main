################################################################################
# Judge0 Configuration (self-hosted, local development)
#
# Generate your own passwords before running this anywhere but your own
# machine — the two placeholders below are NOT safe to use in production.
#   node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
################################################################################

# ── Redis ────────────────────────────────────────────────────────
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=CHANGE_ME_judge0_redis_password

# ── PostgreSQL ───────────────────────────────────────────────────
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=CHANGE_ME_judge0_postgres_password

# ── Submission limits ────────────────────────────────────────────
# Max size (KB) of a single submission's source code / stdin / etc.
MAX_QUEUE_SIZE=100
ENABLE_WAIT_RESULT=false
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=false

CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=1024

# ── Networking / security ────────────────────────────────────────
# Keep student-submitted code from making outbound network calls.
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Leave blank for local dev. For any deployment reachable from outside
# your machine, set these so /submissions requires a token:
#   AUTHN_HEADER=X-Auth-Token
#   AUTHN_TOKEN=<a long random string>
AUTHN_HEADER=
AUTHN_TOKEN=
AUTHZ_HEADER=
AUTHZ_TOKEN=

# ── Misc ──────────────────────────────────────────────────────────
JUDGE0_TELEMETRY_ENABLE=false
MAINTENANCE_MODE=false
