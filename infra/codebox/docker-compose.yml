services:
  codebox-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://codebox-redis:6379
      - AUTH_TOKEN=dev-token
      - EXECUTOR_TYPE=docker
      - PORT=3000
      - BODY_LIMIT=50mb
    depends_on:
      - codebox-redis
    volumes:
      - ./src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  codebox-worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: node src/queue/worker.js
    privileged: true
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://codebox-redis:6379
      - EXECUTOR_TYPE=docker
      - WORKER_CONCURRENCY=4
      - DEFAULT_CPU_TIME_LIMIT=5
      - DEFAULT_MEMORY_LIMIT=256000
      - MAX_MEMORY_LIMIT=512000
    depends_on:
      - codebox-redis
    volumes:
      - ./src:/app/src:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  codebox-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - codebox_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  codebox_redis_data:
