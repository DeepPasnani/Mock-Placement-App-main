services:
  codebox-api:
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://codebox-redis:6379
      - AUTH_TOKEN=${CODEBOX_AUTH_TOKEN}
      - PORT=3000
      - BODY_LIMIT=50mb
      - RATE_LIMIT_MAX_REQUESTS=${CODEBOX_RATE_LIMIT:-200}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  codebox-worker:
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://codebox-redis:6379
      - EXECUTOR_TYPE=docker
      - WORKER_CONCURRENCY=${CODEBOX_WORKER_CONCURRENCY:-6}
      - DEFAULT_CPU_TIME_LIMIT=${CODEBOX_CPU_TIME_LIMIT:-5}
      - DEFAULT_MEMORY_LIMIT=${CODEBOX_MEMORY_LIMIT:-256000}
      - MAX_MEMORY_LIMIT=${CODEBOX_MAX_MEMORY_LIMIT:-512000}
      - RESULT_CACHE_TTL=${CODEBOX_CACHE_TTL:-1800}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 10G

  codebox-redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
