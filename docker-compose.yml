services:
  postgres:
    image: postgres:16-alpine
    container_name: pp_postgres
    environment:
      POSTGRES_DB: placementpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pp_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:2828
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/placementpro
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-jwt-secret-please-change-in-production
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: local-dev-refresh-secret-please-change-in-production
      TZ: Asia/Kolkata
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(JSON.parse(d).status==='ok'?0:1)) }).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend_init
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/placementpro
      REDIS_URL: redis://redis:6379
    entrypoint: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ""
        VITE_APP_NAME: "CampusTrack"
        VITE_API_URL: "/api"
        VITE_WS_URL: "ws://localhost:2828/ws"
        VITE_COLLEGE_NAME: "Your College"
    container_name: pp_frontend
    ports:
      - "2828:80"
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@placementpro.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8467:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
