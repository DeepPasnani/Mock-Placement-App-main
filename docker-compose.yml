services:
  # ─────────────────────────────────────────────────────────────
  # Codebox (code execution engine) — included by default.
  # Services: codebox-api, codebox-worker, codebox-redis.
  # ─────────────────────────────────────────────────────────────

  codebox-redis:
    image: redis:7-alpine
    container_name: pp_codebox_redis
    ports:
      - "6380:6379"
    volumes:
      - codebox_redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  codebox-api:
    build:
      context: ./infra/codebox
      dockerfile: docker/api/Dockerfile
    container_name: pp_codebox_api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://codebox-redis:6379
      AUTH_TOKEN: ${CODEBOX_AUTH_TOKEN:-dev-token}
      EXECUTOR_TYPE: docker
      PORT: 3000
      BODY_LIMIT: 50mb
      RATE_LIMIT_MAX_REQUESTS: 10000
      RATE_LIMIT_WINDOW_MS: 60000
    depends_on:
      codebox-redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  codebox-worker:
    build:
      context: ./infra/codebox
      dockerfile: docker/worker/Dockerfile
    container_name: pp_codebox_worker
    command: node src/queue/worker.js
    privileged: true
    environment:
      NODE_ENV: production
      REDIS_URL: redis://codebox-redis:6379
      EXECUTOR_TYPE: docker
      WORKER_CONCURRENCY: 4
      DEFAULT_CPU_TIME_LIMIT: 5
      DEFAULT_MEMORY_LIMIT: 256000
      MAX_MEMORY_LIMIT: 512000
      CONTAINER_POOL_ENABLED: ${CONTAINER_POOL_ENABLED:-false}
      MAX_OUTPUT_SIZE: ${MAX_OUTPUT_SIZE:-1048576}
    depends_on:
      codebox-redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pp_postgres
    environment:
      POSTGRES_DB: campustrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pp_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:2828
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-jwt-secret-please-change-in-production
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: local-dev-refresh-secret-please-change-in-production
      TZ: Asia/Kolkata
      # SMTP / email — NOT read from backend/.env (that file is only used
      # when running the backend directly with `node src/index.js`; Docker
      # never sees it — it's excluded via backend/.dockerignore and this
      # environment: block is the only thing that reaches the container).
      # Put real values in a `.env` file at the PROJECT ROOT (next to this
      # docker-compose.yml — see .env.example) and Compose will substitute
      # them here automatically. Leave the root .env entries blank/unset
      # to keep email sending disabled (OTP/notification emails are then
      # silently skipped, which is the previous default behavior).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CampusTrack <noreply@campustrack.local>}
      CODEBOX_API_URL: http://codebox-api:3000
      # Must match codebox-api's AUTH_TOKEN default above (both derive from
      # the same CODEBOX_AUTH_TOKEN root .env var) — otherwise the backend
      # sends no X-Auth-Token header while codebox-api's authMiddleware
      # requires one, and every /submissions call (Run Code, coding-test
      # grading) gets a 401.
      CODEBOX_AUTH_TOKEN: ${CODEBOX_AUTH_TOKEN:-dev-token}
      CODE_EXECUTION_PROVIDER: codebox
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      codebox-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(JSON.parse(d).status==='ok'?0:1)) }).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend_init
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack
      REDIS_URL: redis://redis:6379
    entrypoint: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ""
        VITE_APP_NAME: "CampusTrack"
        VITE_API_URL: "/api"
        VITE_WS_URL: "ws://localhost:2828/ws"
        VITE_COLLEGE_NAME: "Your College"
    container_name: pp_frontend
    ports:
      - "2828:80"
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campustrack.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8467:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  codebox_redis_data:
