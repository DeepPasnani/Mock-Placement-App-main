services:
  # ─────────────────────────────────────────────────────────────
  # Piston (code execution engine) — included by default.
  # Services: piston1/2/3 (execution replicas) + piston-lb (nginx LB).
  # See infra/piston/README.md — after first `docker compose up` you must
  # run ./infra/piston/scripts/install-packages.sh once.
  # ─────────────────────────────────────────────────────────────

  piston1: &piston-replica
    image: ghcr.io/engineer-man/piston:latest
    container_name: pp_piston1
    privileged: true
    environment:
      PISTON_MAX_CONCURRENT_JOBS: ${PISTON_MAX_CONCURRENT_JOBS:-80}
      PISTON_RUN_TIMEOUT: 15000
      PISTON_COMPILE_TIMEOUT: 15000
      PISTON_RUN_MEMORY_LIMIT: 536870912
      PISTON_COMPILE_MEMORY_LIMIT: 536870912
      # DEBUG surfaces "Downloading package from <url>..." / "Installed X-Y"
      # log lines during package installs — useful when watched live via
      # `docker compose logs -f piston1` (see infra/piston/README.md).
      PISTON_LOG_LEVEL: DEBUG
    volumes:
      - piston_packages:/piston/packages
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  piston2:
    <<: *piston-replica
    container_name: pp_piston2

  piston3:
    <<: *piston-replica
    container_name: pp_piston3

  piston-lb:
    image: nginx:alpine
    container_name: pp_piston_lb
    volumes:
      - ./infra/piston/lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "2000:2000"
    depends_on:
      piston1:
        condition: service_healthy
      piston2:
        condition: service_healthy
      piston3:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pp_postgres
    environment:
      POSTGRES_DB: campustrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pp_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:2828
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-jwt-secret-please-change-in-production
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: local-dev-refresh-secret-please-change-in-production
      TZ: Asia/Kolkata
      # SMTP / email — NOT read from backend/.env (that file is only used
      # when running the backend directly with `node src/index.js`; Docker
      # never sees it — it's excluded via backend/.dockerignore and this
      # environment: block is the only thing that reaches the container).
      # Put real values in a `.env` file at the PROJECT ROOT (next to this
      # docker-compose.yml — see .env.example) and Compose will substitute
      # them here automatically. Leave the root .env entries blank/unset
      # to keep email sending disabled (OTP/notification emails are then
      # silently skipped, which is the previous default behavior).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CampusTrack <noreply@campustrack.local>}
      # Google sign-in (optional). Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
      # in the root .env to enable "Sign in with Google" on the login page.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # AI features (optional). Set OPENAI_API_KEY in the root .env to enable
      # AI question generation, coding hints, auto-tagging, feedback, and NL
      # analytics. Any OpenAI-compatible endpoint works (see aiService.js).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      PISTON_API_URL: http://piston-lb:2000/api/v2
      CODE_EXECUTION_PROVIDER: piston
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      piston-lb:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(JSON.parse(d).status==='ok'?0:1)) }).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pp_backend_init
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack
      REDIS_URL: redis://redis:6379
    entrypoint: ["sh", "-c", "node src/db/migrate.js && node src/db/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_APP_NAME: "CampusTrack"
        VITE_API_URL: "/api"
        VITE_WS_URL: "ws://localhost:2828/ws"
        VITE_COLLEGE_NAME: "Your College"
    container_name: pp_frontend
    ports:
      - "2828:80"
    depends_on:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campustrack.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8467:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Observability — Prometheus + Alertmanager + Blackbox exporter,
  # Grafana dashboards, Loki + Promtail log aggregation, and DB/cache/
  # host exporters. Brought up automatically with the rest of the site.
  #
  #   Grafana        http://localhost:3000   (admin / ${GRAFANA_PASSWORD:-admin})
  #   Prometheus     http://localhost:9090
  #   Alertmanager   http://localhost:9093
  #   Loki           http://localhost:3100
  # ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: pp_prometheus
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: pp_alertmanager
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: pp_blackbox
    volumes:
      - ./infra/prometheus/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    ports:
      - "9115:9115"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: pp_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: pp_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/promtail
    depends_on:
      - loki
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pp_pg_exporter
    environment:
      DATA_SOURCE_NAME: 'postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack?sslmode=disable'
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pp_redis_exporter
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pp_node_exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  piston_packages:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
