name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend dependencies
        run: |
          cd backend
          npm ci

      - name: Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Backend lint
        run: |
          cd backend
          npx eslint src/ --ext .js --no-error-on-unmatched-pattern || echo "Lint warnings found"

      - name: Frontend lint
        run: |
          cd frontend
          npx eslint src/ --ext .js,.jsx --no-error-on-unmatched-pattern || echo "Lint warnings found"

      - name: Frontend type check
        run: |
          cd frontend
          npx tsc --noEmit --allowJs --checkJs false || echo "Type check warnings found"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campustrack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install Playwright
        run: |
          cd tests
          npm ci
          npx playwright install chromium

      - name: Run database migrations
        run: |
          cd backend
          DATABASE_URL="postgresql://postgres:test_password@localhost:5433/campustrack_test" \
          REDIS_URL="redis://localhost:6379" \
          JWT_SECRET="test-jwt-secret" \
          JWT_EXPIRES_IN="7d" \
          node src/db/migrate.js
          DATABASE_URL="postgresql://postgres:test_password@localhost:5433/campustrack_test" \
          REDIS_URL="redis://localhost:6379" \
          JWT_SECRET="test-jwt-secret" \
          node src/db/seed.js

      - name: Start backend
        run: |
          cd backend
          DATABASE_URL="postgresql://postgres:test_password@localhost:5433/campustrack_test" \
          REDIS_URL="redis://localhost:6379" \
          JWT_SECRET="test-jwt-secret" \
          JWT_EXPIRES_IN="7d" \
          PORT=5000 \
          node src/index.js &
          sleep 5
          curl -f http://localhost:5000/health || echo "Backend health check failed"

      - name: Run Playwright tests
        run: |
          cd tests
          BASE_URL="http://localhost:5000" \
          API_URL="http://localhost:5000" \
          npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/campustrack
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
            echo "Deployment completed at $(date)"
