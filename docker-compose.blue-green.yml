# Blue-green overlay. Combine with the base file, but start an explicit
# service list so the old singular `backend` and the frontend's own nginx
# don't also come up:
#
#   docker compose -f docker-compose.yml -f docker-compose.blue-green.yml \
#     up -d --build postgres redis piston1 piston2 piston3 piston-lb \
#     backend-init backend-blue backend-green frontend-dist nginx pgadmin
#
# Then use scripts/deploy-blue-green.sh to initialize nginx's routing,
# deploy new versions to the inactive side, and flip/rollback traffic.
#
# See infra/deployment-strategy.md for the overall flow and
# infra/blue-green-nginx.conf for the nginx template this drives.

# Merged blue-green + load-balanced overlay: blue and green are each a
# horizontally-scalable pool (not a single container), combining
# docker-compose.lb.yml's replica model with docker-compose.blue-green.yml's
# active/inactive flip. Combine with the base file and scale whichever
# color(s) you're using:
#
#   docker compose -f docker-compose.yml -f docker-compose.blue-green.yml \
#     up -d --build --scale backend-blue=3 --scale backend-green=0 \
#     postgres redis piston1 piston2 piston3 piston-lb \
#     backend-init backend-blue backend-green frontend-dist nginx
#
# (--scale backend-green=0 just means "define it but don't start any
# instances yet" — scripts/deploy-blue-green.sh deploy green will scale it
# up when you actually deploy to it.)
#
# Then use scripts/deploy-blue-green.sh to initialize nginx's routing,
# deploy new versions to the inactive color, and flip/rollback traffic.
#
# See infra/deployment-strategy.md for the overall flow and
# infra/blue-green-nginx.conf for the nginx template this drives.

services:
  # Both colors listen on the same internal port (5000) — they're
  # distinguished by service/hostname (backend-blue vs backend-green), not
  # by port. Neither publishes a host port: with N replicas per color you
  # can't map them all to one fixed host port anyway, so all health checks
  # and smoke tests run over the internal Docker network (see the script) —
  # exactly like docker-compose.lb.yml's `backend` service.
  #
  # No `container_name` on either: Compose rejects a fixed container name
  # once a service is scaled past 1 replica.
  backend-blue: &backend-bg-common
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &backend-bg-env
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com}
      DATABASE_URL: postgresql://postgres:postgres_password_change_me@postgres:5432/campustrack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your root .env}
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET must be set in your root .env}
      TZ: Asia/Kolkata
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CampusTrack <noreply@your-domain.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      PISTON_API_URL: http://piston-lb:2000/api/v2
      CODE_EXECUTION_PROVIDER: piston
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      piston-lb:
        condition: service_started
    healthcheck: &backend-bg-healthcheck
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => { let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(JSON.parse(d).status==='ok'?0:1)) }).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend-green:
    <<: *backend-bg-common

  # Same one-shot pattern as docker-compose.lb.yml: build the frontend and
  # drop the compiled dist/ into a volume nginx serves from directly.
  frontend-dist:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_APP_NAME: "CampusTrack"
        VITE_API_URL: "/api"
        VITE_WS_URL: "wss://your-domain.com/ws"
        VITE_COLLEGE_NAME: "Your College"
    container_name: pp_frontend_dist
    command: ["sh", "-c", "rm -rf /out/* && cp -r /app/dist/. /out/"]
    volumes:
      - frontend_dist:/out
    restart: "no"

  # nginx.conf here is a WRITABLE bind mount (not :ro) — deploy-blue-green.sh
  # generates infra/nginx-active.conf on the host from the
  # infra/blue-green-nginx.conf template (substituting __ACTIVE_ENV__ and
  # your domain) and this container just reloads to pick up each change.
  # The upstream in that template targets a bare service name
  # (backend-blue or backend-green), which Docker's embedded DNS resolves
  # to every currently-running replica of that service — same mechanism
  # docker-compose.lb.yml uses for its single `backend` pool.
  nginx:
    image: nginx:alpine
    container_name: pp_nginx_bluegreen
    volumes:
      - ./infra/nginx-active.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl:/etc/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend-dist:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  frontend_dist:
